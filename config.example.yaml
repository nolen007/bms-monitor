# EG4 Battery Monitor Configuration
# Copy this file to config.yaml and edit with your settings

# Multiple batteries configuration
batteries:
  - name: "EG4 WallMount 280Ah"
    ip: "192.168.130.139"
    port: 4196
    device_id: 1
    protocol: "eg4"  # Use "eg4" for EG4 batteries
  
  - name: "ECO-WORTHY 314Ah"
    ip: "192.168.130.95"
    port: 4196
    device_id: 1
    protocol: "ecoworthy"  # Use "ecoworthy" for ECO-WORTHY/PACE BMS batteries
  
  - name: "JK BMS 314Ah"
    ip: "192.168.129.118"
    port: 4196
    device_id: 0           # Use 0 for RS485-1 port, or 1+ for RS485-2 with DIP switches
    protocol: "jkbms"      # Use "jkbms" for JK BMS PB series (Inverter BMS)
    # Note: JK BMS requires:
    #   - RS485-1 port (leftmost RJ45) for device_id 0
    #   - Waveshare in TCP Server mode (NOT Modbus TCP to RTU)
    #   - Baud rate: 115200

  - name: "CAN Battery Pack 1"
    ip: "192.168.1.50"
    port: 4444             # Port your CAN-to-Ethernet bridge listens on
    protocol: "canip"      # CAN bus messages tunneled over TCP/IP
    # Optional CAN/IP settings:
    # can_pack_address: 0x40   # Pack address byte; 0x40=pack1, 0x41=pack2, …
    # can_length_prefixed: false  # Set true if bridge prepends a 2-byte frame length
    # can_sniff_only: false       # Set true to listen passively (no poll request sent)
    #
    # Compatible hardware examples:
    #   - Waveshare CAN-ETH (transparent TCP mode)
    #   - USR-TCP232-E2 with CAN module
    #   - Any device forwarding raw 13-byte CAN frames over TCP

mqtt:
  # Home Assistant MQTT broker address
  broker: "192.168.128.149"
  port: 1883
  username: "homeassistant"
  password: "your-mqtt-password"
  # Base topic for Home Assistant auto-discovery
  base_topic: "homeassistant"

web:
  # Enable web GUI (accessible at http://your-ip:5000)
  enabled: true
  # Host to bind to (0.0.0.0 = all interfaces)
  host: "0.0.0.0"
  # Web server port
  port: 5000

monitor:
  # How often to poll the batteries (seconds)
  interval: 30
  # Show terminal UI (set to false for headless/service mode)
  ui_enabled: true
  # Enable debug logging
  debug: false
  # SOC% treated as "empty" for the time-to-low-SOC countdown shown in the
  # web GUI, terminal UI, and MQTT. E.g. 15 to stop at your inverter's
  # low-voltage cutoff instead of 0%.
  low_soc_cutoff: 0

# Virtual Modbus TCP Server — Solar Assistant gateway
# Exposes all batteries as a single combined Pylontech-compatible Modbus device.
# Solar Assistant setup:
#   Settings → Battery monitor → Pylontech (RS485/Modbus) → TCP
#   IP: <this monitor's IP>    Port: 502    Device ID: 1
modbus_server:
  enabled: false          # Set to true to enable
  host: "0.0.0.0"        # Bind to all interfaces
  port: 5020              # Use 5020 to avoid needing root (port 502 requires sudo)
